apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: sujithmsuji/devops-nginx:IMAGE_VERSION
          imagePullPolicy: Always
          ports:
            - containerPort: 80
