apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nginx-vpa
  namespace: production-app

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment

  updatePolicy:
    updateMode: "Off"

  resourcePolicy:
    containerPolicies:
      - containerName: nginx
        minAllowed:
          cpu: 25m
          memory: 16Mi
        maxAllowed:
          cpu: 500m
          memory: 256Mi
        controlledResources:
          - cpu
          - memory
